<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招聘职位 - Sunwood Consulting</title>
  <script src="supabase.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
    .container{max-width:1000px;margin:0 auto;padding:20px}
    header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#1e3a5f 0%,#2d5a87 100%);color:#fff;border-radius:0 0 20px 20px;margin-bottom:30px}
    header h1{font-size:1.8rem;font-weight:600;margin-bottom:8px;letter-spacing:1px}
    header p{opacity:.9;font-size:.95rem}
    .filters{background:#fff;padding:20px;border-radius:12px;margin-bottom:25px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .filters h2{color:#1e3a5f;font-size:1.1rem;margin-bottom:15px}
    .filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
    @media(max-width:768px){.filter-row{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.filter-row{grid-template-columns:1fr}}
    .filter-group label{font-size:.85rem;color:#666;margin-bottom:5px;display:block}
    .filter-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:.9rem}
    .job-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    @media(max-width:768px){.job-grid{grid-template-columns:1fr}}
    .job-card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}
    .job-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
    .job-card h3{color:#1e3a5f;font-size:1.15rem;margin-bottom:8px}
    .job-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:.85rem;color:#666}
    .job-meta span{background:#f1f5f9;padding:4px 10px;border-radius:20px}
    .job-company{font-weight:600;color:#444;margin-bottom:8px}
    .job-desc{color:#555;font-size:.9rem;line-height:1.5;margin-bottom:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .job-salary{color:#1e3a5f;font-weight:600;font-size:.95rem;margin-bottom:15px}
    .job-card a{display:inline-block;padding:8px 18px;background:#1e3a5f;color:#fff;border-radius:6px;text-decoration:none;font-size:.9rem;transition:opacity .2s}
    .job-card a:hover{opacity:.9}
    .empty{text-align:center;padding:50px;color:#888}
    footer{text-align:center;padding:30px;color:#999;font-size:.8rem}
  </style>
</head>
<body>
  <header>
    <h1>SUNWOOD CONSULTING</h1>
    <p>Future Management Consulting · Migration and Recruitment Service</p>
    <p style="margin-top:8px;font-size:.85rem">"Connecting Talent with Australian Employers"</p>
  </header>

  <div class="container">
    <div class="filters">
      <h2>筛选职位</h2>
      <div class="filter-row">
        <div class="filter-group">
          <label>职能分类</label>
          <select id="categoryFilter">
            <option value="">全部</option>
            <option>高管/领导层</option>
            <option>行政/办公支持</option>
            <option>财务/会计</option>
            <option>销售/业务拓展</option>
            <option>市场/品牌/公关</option>
            <option>人力资源</option>
            <option>信息技术</option>
            <option>工程</option>
            <option>建筑/技工</option>
            <option>生产/运营</option>
            <option>物流/仓储/供应链</option>
            <option>医疗/养老护理</option>
            <option>教育/培训</option>
            <option>酒店/旅游/餐饮</option>
            <option>零售/客户服务</option>
            <option>法律</option>
            <option>房地产/物业</option>
            <option>农业/食品</option>
            <option>其他</option>
          </select>
        </div>
        <div class="filter-group">
          <label>职位级别</label>
          <select id="levelFilter">
            <option value="">全部</option>
            <option>Junior / Entry</option>
            <option>Mid-level</option>
            <option>Senior</option>
            <option>Executive / Leadership</option>
          </select>
        </div>
        <div class="filter-group">
          <label>工作类型</label>
          <select id="workTypeFilter">
            <option value="">全部</option>
            <option>全职</option>
            <option>兼职</option>
            <option>合同工</option>
            <option>临时工</option>
            <option>实习</option>
          </select>
        </div>
        <div class="filter-group">
          <label>工作地点</label>
          <select id="locationFilter">
            <option value="">全部</option>
          </select>
        </div>
      </div>
    </div>

    <div id="jobList">
      <p class="empty">加载中...</p>
    </div>
  </div>

  <footer>
    <p>© 2026 Sunwood Consulting Group. All rights reserved.</p>
  </footer>

  <script src="nav.js"></script>
  <script>
    const SUPABASE_URL = 'https://isaauyxjwdkjciwweuhk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYWF1eXhqd2RramNpd3dldWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDY4NjksImV4cCI6MjA4OTk4Mjg2OX0.WvE8GkzpqJs7BPRmrayxcu7P0-nFX6rafsZQ0DA3EyY';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });

    let allJobs = [];

    async function loadJobs() {
      const container = document.getElementById('jobList');
      container.innerHTML = '<p class="empty">加载中...</p>';

      const { data, error } = await supabaseClient
        .from('jobs')
        .select('*')
        .eq('is_public', true)
        .eq('status', '招聘中')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="empty" style="color:#991b1b">加载失败：' + error.message + '</p>';
        return;
      }

      allJobs = data || [];
      populateLocationFilter(allJobs);
      renderJobs(allJobs);
    }

    function populateLocationFilter(jobs) {
      const select = document.getElementById('locationFilter');
      const locations = [...new Set(jobs.map(j => j.location).filter(Boolean))].sort();
      locations.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        select.appendChild(option);
      });
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobList');
      if (!jobs || jobs.length === 0) {
        container.innerHTML = '<p class="empty">暂无公开招聘职位</p>';
        return;
      }

      container.innerHTML = '<div class="job-grid">' +
        jobs.map(job => {
          const salary = job.salary_min || job.salary_max
            ? `$${job.salary_min || ''}${job.salary_max ? ' - $' + job.salary_max : '+'} ${job.currency || 'AUD'}`
            : '薪资面议';
          const req = job.requirements || {};
          return '<div class="job-card">' +
            '<h3>' + escapeHtml(job.title) + '</h3>' +
            '<div class="job-company">' + escapeHtml(job.company_name || 'Sunwood 合作雇主') + '</div>' +
            '<div class="job-meta">' +
              '<span>' + escapeHtml(job.category || '') + '</span>' +
              '<span>' + escapeHtml(job.level || '') + '</span>' +
              '<span>' + escapeHtml(job.work_type || '') + '</span>' +
              '<span>' + escapeHtml(job.location || '') + '</span>' +
            '</div>' +
            '<div class="job-desc">' + escapeHtml(job.description || '') + '</div>' +
            '<div class="job-salary">' + escapeHtml(salary) + '</div>' +
            '<a href="job-detail-public.html?id=' + job.id + '">查看详情</a>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function filterJobs() {
      const category = document.getElementById('categoryFilter').value;
      const level = document.getElementById('levelFilter').value;
      const workType = document.getElementById('workTypeFilter').value;
      const location = document.getElementById('locationFilter').value;

      const filtered = allJobs.filter(job => {
        return (!category || job.category === category) &&
               (!level || job.level === level) &&
               (!workType || job.work_type === workType) &&
               (!location || job.location === location);
      });

      renderJobs(filtered);
    }

    ['categoryFilter', 'levelFilter', 'workTypeFilter', 'locationFilter'].forEach(id => {
      document.getElementById(id).addEventListener('change', filterJobs);
    });

    loadJobs();
  </script>
</body>
</html>

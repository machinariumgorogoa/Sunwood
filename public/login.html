<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Sunwood Consulting</title>
  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;color:#333;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
    .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .login-card{background:#fff;width:100%;max-width:420px;padding:35px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .login-card h1{font-size:1.5rem;color:#1e3a5f;margin-bottom:8px;text-align:center}
    .login-card p.subtitle{color:#666;font-size:.9rem;text-align:center;margin-bottom:25px}
    .form-group{margin-bottom:18px}
    label{display:block;font-weight:600;color:#444;margin-bottom:6px;font-size:.9rem}
    input[type="email"],input[type="password"]{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:8px;font-size:.95rem;transition:border .2s}
    input:focus{outline:none;border-color:#2d5a87}
    button[type="submit"]{width:100%;padding:13px;background:linear-gradient(135deg,#1e3a5f 0%,#2d5a87 100%);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s}
    button[type="submit"]:hover{opacity:.9}
    button[type="submit"]:disabled{opacity:.5;cursor:not-allowed}
    .message{padding:12px 15px;border-radius:8px;margin-bottom:18px;display:none;font-size:.9rem}
    .message.success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
    .message.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .message.info{background:#e0f2fe;color:#1e40af;border:1px solid #bae6fd}
    .extra-links{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:.85rem}
    .extra-links a{color:#1e3a5f;text-decoration:none}
    .extra-links a:hover{text-decoration:underline}
    footer{text-align:center;padding:25px;color:#999;font-size:.8rem}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>内部员工登录</h1>
      <p class="subtitle">Sunwood CRM 登录入口</p>
      <div id="msg" class="message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" name="email" placeholder="name@sunwood.com.au" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" id="submitBtn">登录</button>
        <div class="extra-links">
          <a href="#" id="forgotLink">忘记密码？</a>
          <a href="index.html">返回首页</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2026 Sunwood Consulting Group. All rights reserved.</p>
  </footer>

  <script src="nav.js"></script>
  <script>
    (async function () {
      await window.sunwood.ready;
      const staff = await window.sunwood.getCurrentStaff();
      if (staff) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.replace(redirect);
        return;
      }

      const form = document.getElementById('loginForm');
      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      const forgotLink = document.getElementById('forgotLink');

      function showMessage(text, type) {
        msg.style.display = 'block';
        msg.className = 'message ' + type;
        msg.textContent = text;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = '登录中...';
        msg.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await window.sunwood.auth.signInWithPassword({ email, password });

        if (error || !data.session) {
          showMessage('登录失败：' + (error?.message || '请检查邮箱和密码'), 'error');
          btn.disabled = false;
          btn.textContent = '登录';
          return;
        }

        showMessage('登录成功，正在跳转...', 'success');
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.href = redirect;
      });

      forgotLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email || !email.includes('@')) {
          showMessage('请先输入邮箱地址，再点击忘记密码。', 'info');
          return;
        }
        btn.disabled = true;
        const { error } = await window.sunwood.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/login.html'
        });
        if (error) {
          showMessage('重置邮件发送失败：' + error.message, 'error');
        } else {
          showMessage('密码重置邮件已发送，请检查邮箱。', 'success');
        }
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>

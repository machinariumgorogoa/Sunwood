<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理 - Sunwood Consulting</title>
  <script src="supabase.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#1e3a5f 0%,#2d5a87 100%);color:#fff;border-radius:0 0 20px 20px;margin-bottom:30px}
    header h1{font-size:1.8rem;font-weight:600;margin-bottom:8px;letter-spacing:1px}
    header p{opacity:.9;font-size:.95rem}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:25px}
    .stat-card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
    .stat-card .number{font-size:1.8rem;font-weight:700;color:#1e3a5f}
    .stat-card .label{font-size:.85rem;color:#666;margin-top:4px}
    .filters{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .filters h2{color:#1e3a5f;font-size:1.1rem;margin-bottom:15px}
    .filter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
    .filter-group label{font-size:.85rem;color:#666;margin-bottom:5px;display:block}
    .filter-group input,.filter-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:.9rem}
    .table-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
    th{background:#f8fafc;color:#1e3a5f;font-weight:600}
    td{color:#555}
    tr:hover{background:#f8fafc}
    .status-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
    .status-潜在客户{background:#fef3c7;color:#92400e}
    .status-合作中{background:#d1fae5;color:#065f46}
    .status-暂停{background:#fee2e2;color:#991b1b}
    .status-终止{background:#f3f4f6;color:#6b7280}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-block;padding:6px 12px;background:#1e3a5f;color:#fff;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;text-decoration:none}
    .btn:hover{opacity:.9}
    .btn.small{padding:4px 10px;font-size:.75rem}
    .message{padding:12px 15px;border-radius:8px;margin-bottom:20px;display:none;font-size:.9rem}
    .message.success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
    .message.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .empty{text-align:center;padding:50px;color:#888}
    footer{text-align:center;padding:30px;color:#999;font-size:.8rem}
  </style>
</head>
<body>
  <header>
    <h1>SUNWOOD CONSULTING</h1>
    <p>Future Management Consulting · Migration and Recruitment Service</p>
  </header>

  <div class="container">
    <div class="stats" id="stats">
      <div class="stat-card"><div class="number" id="statTotal">-</div><div class="label">客户总数</div></div>
      <div class="stat-card"><div class="number" id="statActive">-</div><div class="label">合作中</div></div>
      <div class="stat-card"><div class="number" id="statJobs">-</div><div class="label">在招职位</div></div>
      <div class="stat-card"><div class="number" id="statHired">-</div><div class="label">累计入职</div></div>
    </div>

    <div class="filters">
      <h2>筛选客户</h2>
      <div class="filter-row">
        <div class="filter-group">
          <label>搜索公司名称</label>
          <input type="text" id="searchInput" placeholder="公司名称">
        </div>
        <div class="filter-group">
          <label>客户状态</label>
          <select id="statusFilter">
            <option value="">全部</option>
            <option>潜在客户</option>
            <option>合作中</option>
            <option>暂停</option>
            <option>终止</option>
          </select>
        </div>
        <div class="filter-group">
          <label>负责顾问</label>
          <select id="managerFilter"><option value="">全部</option></select>
        </div>
      </div>
    </div>

    <div id="msg" class="message"></div>

    <div class="table-wrap">
      <table id="clientsTable">
        <thead>
          <tr>
            <th>公司名称</th>
            <th>行业</th>
            <th>主要联系人</th>
            <th>状态</th>
            <th>负责顾问</th>
            <th>历史职位</th>
            <th>已入职</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="clientsBody">
          <tr><td colspan="8" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>© 2026 Sunwood Consulting Group. All rights reserved.</p>
  </footer>

  <script src="nav.js"></script>
  <script>
    const SUPABASE_URL = 'https://isaauyxjwdkjciwweuhk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzYWF1eXhqd2RramNpd3dldWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDY4NjksImV4cCI6MjA4OTk4Mjg2OX0.WvE8GkzpqJs7BPRmrayxcu7P0-nFX6rafsZQ0DA3EyY';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });

    const CLIENT_STATUSES = ['潜在客户','合作中','暂停','终止'];
    const MANAGER_NAMES = ['Alice Zhang','Bob Li','Carol Wang','David Chen','Emma Liu'];

    let allClients = [];
    let allJobs = [];
    let allApplications = [];

    async function loadData() {
      const tbody = document.getElementById('clientsBody');
      tbody.innerHTML = '<tr><td colspan="8" class="empty">加载中...</td></tr>';

      const [{ data: clients, error: clientsError }, { data: jobs, error: jobsError }, { data: apps, error: appsError }] = await Promise.all([
        supabaseClient.from('companies').select('*').eq('is_client', true).order('created_at', { ascending: false }),
        supabaseClient.from('jobs').select('id,company_id,status'),
        supabaseClient.from('applications').select('id,job_id,status')
      ]);

      if (clientsError) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">加载失败：' + clientsError.message + '</td></tr>';
        return;
      }

      allClients = clients || [];
      allJobs = jobs || [];
      allApplications = apps || [];

      updateStats();
      populateFilters();
      renderClients(allClients);
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allClients.length;
      document.getElementById('statActive').textContent = allClients.filter(c => c.client_status === '合作中').length;

      const jobIdsForClients = allJobs.filter(j => allClients.some(c => c.id === j.company_id)).map(j => j.id);
      document.getElementById('statJobs').textContent = allJobs.filter(j => jobIdsForClients.includes(j.id) && j.status === '招聘中').length;

      const hiredAppJobIds = allApplications.filter(a => a.status === 'hired').map(a => a.job_id);
      document.getElementById('statHired').textContent = allJobs.filter(j => jobIdsForClients.includes(j.id) && hiredAppJobIds.includes(j.id)).length;
    }

    function populateFilters() {
      const managers = [...new Set(allClients.map(c => c.account_manager).filter(Boolean))].sort();
      const sel = document.getElementById('managerFilter');
      const current = sel.value;
      sel.innerHTML = '<option value="">全部</option>' +
        managers.map(m => '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>').join('');
      sel.value = current;
    }

    function getJobCount(companyId) {
      return allJobs.filter(j => j.company_id === companyId).length;
    }

    function getHiredCount(companyId) {
      const jobIds = allJobs.filter(j => j.company_id === companyId).map(j => j.id);
      return allApplications.filter(a => jobIds.includes(a.job_id) && a.status === 'hired').length;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderClients(clients) {
      const tbody = document.getElementById('clientsBody');
      if (!clients || clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无客户公司</td></tr>';
        return;
      }

      tbody.innerHTML = clients.map(c => {
        const statusClass = 'status-' + (c.client_status || '潜在客户');
        const jobCount = getJobCount(c.id);
        const hiredCount = getHiredCount(c.id);
        return '<tr>' +
          '<td><strong><a href="client-detail.html?id=' + c.id + '" style="color:#1e3a5f;text-decoration:none">' + escapeHtml(c.company_name || '-') + '</a></strong></td>' +
          '<td>' + escapeHtml(c.industry || '-') + '</td>' +
          '<td>' + escapeHtml(c.primary_contact || c.contact_name || '-') + '<br><span style="color:#888;font-size:.8rem">' + escapeHtml(c.contact_email || '') + '</span></td>' +
          '<td>' +
            '<select class="status-select" data-id="' + c.id + '" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:.85rem">' +
              CLIENT_STATUSES.map(s => '<option value="' + s + '"' + (s === c.client_status ? ' selected' : '') + '>' + s + '</option>').join('') +
            '</select>' +
          '</td>' +
          '<td>' +
            '<select class="manager-select" data-id="' + c.id + '" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:.85rem">' +
              '<option value="">未分配</option>' +
              MANAGER_NAMES.map(m => '<option value="' + m + '"' + (m === c.account_manager ? ' selected' : '') + '>' + m + '</option>').join('') +
            '</select>' +
          '</td>' +
          '<td>' + (jobCount > 0 ? '<a href="jobs-internal.html?company_id=' + c.id + '">' + jobCount + ' 个</a>' : '0') + '</td>' +
          '<td>' + hiredCount + ' 人</td>' +
          '<td class="actions">-</td>' +
        '</tr>';
      }).join('');

      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const { error } = await supabaseClient.from('companies').update({ client_status: sel.value }).eq('id', id);
          if (error) showMsg('更新失败：' + error.message, 'error');
          else { showMsg('客户状态已更新', 'success'); const c = allClients.find(x => x.id === id); if (c) c.client_status = sel.value; updateStats(); }
        });
      });

      document.querySelectorAll('.manager-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const { error } = await supabaseClient.from('companies').update({ account_manager: sel.value }).eq('id', id);
          if (error) showMsg('更新失败：' + error.message, 'error');
          else { showMsg('负责顾问已更新', 'success'); const c = allClients.find(x => x.id === id); if (c) c.account_manager = sel.value; populateFilters(); }
        });
      });
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.className = 'message ' + type;
      msg.textContent = text;
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }

    function filterClients() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const manager = document.getElementById('managerFilter').value;

      const filtered = allClients.filter(c => {
        const matchSearch = !search || (c.company_name || '').toLowerCase().includes(search);
        const matchStatus = !status || c.client_status === status;
        const matchManager = !manager || c.account_manager === manager;
        return matchSearch && matchStatus && matchManager;
      });

      renderClients(filtered);
    }

    ['searchInput','statusFilter','managerFilter'].forEach(id => {
      document.getElementById(id).addEventListener('input', filterClients);
      document.getElementById(id).addEventListener('change', filterClients);
    });

    loadData();
  </script>
</body>
</html>
